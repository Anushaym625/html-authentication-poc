<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
   <!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

<div class="container d-flex justify-content-center align-items-center vh-100">

<div class="card auth-card">

<h1 class="fw-bold mb-2">Login</h1>
<p class="text-muted mb-4">Hi, Welcome back 👋</p>

<button class="btn google-btn w-100 mb-3">
<i class="bi bi-google me-2"></i>
Login with Google
</button>

<div class="divider mb-4">
<span>or Login with Email</span>
</div>

<form>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" placeholder="E.g. johndoe@email.com">
</div>

<div class="mb-3">
<label class="form-label">Password</label>

<div class="position-relative">

<input type="password" class="form-control pe-5" placeholder="Enter your password">

<i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3"></i>

</div>

</div>

<div class="d-flex justify-content-between align-items-center mb-4">

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Remember Me</label>
</div>

<a href="forget-form.html" class="text-decoration-none">
Forgot Password?
</a>

</div>

<button class="btn btn-primary w-100 mb-3">
    <a href="dashboard.html"> </a>
Login
</button>

<p class="text-center small">
Not registered yet?
<a href="register-form.html">Create an account →</a>
</p>

</form>

</div>

</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
