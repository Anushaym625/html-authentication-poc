<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="styles.css">

</head>

<body class="bg-light">

<!-- 🔹 Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">

    <!-- Logo / Title -->
    <a class="navbar-brand fw-bold">Auth System</a>

    <!-- Right side -->
    <div class="ms-auto">
      <button onclick="logout()" class="btn btn-outline-danger">
        Logout
      </button>
    </div>

  </div>
</nav>

<!-- 🔹 Main Content -->
<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-8 col-lg-6">

      <div class="card p-4 shadow-sm border-0 rounded-4">

        <h2 class="fw-bold mb-3">
          Welcome 👋
        </h2>

        <p class="text-muted">
          You have successfully logged into your dashboard.
        </p>

        <hr>

        <!-- Example Dashboard Content -->
        <div class="row text-center mt-4">

          <div class="col-4">
            <h4 class="fw-bold">5</h4>
            <p class="text-muted small">Projects</p>
          </div>

          <div class="col-4">
            <h4 class="fw-bold">12</h4>
            <p class="text-muted small">Tasks</p>
          </div>

          <div class="col-4">
            <h4 class="fw-bold">3</h4>
            <p class="text-muted small">Messages</p>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<!-- 🔹 Logout Script -->
<script>
function logout(){
  window.location.href = "index.html";
}
</script>

</body>
</html>
