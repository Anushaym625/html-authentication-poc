<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register form</title>
    <!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

<div class="container d-flex justify-content-center align-items-center vh-100">

<div class="card auth-card">

<h1 class="fw-bold mb-2">Create Account</h1>
<p class="text-muted mb-4">Register to get started 🚀</p>

<form>

<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" placeholder="Enter your name">
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" placeholder="Enter email">
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<div class="position-relative">
<input type="password" class="form-control pe-5" placeholder="Create password">
<i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3"></i>
</div>
</div>

<div class="mb-4">
<label class="form-label">Confirm Password</label>
<div class="position-relative">
<input type="password" class="form-control pe-5" placeholder="Confirm password">
<i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3"></i>
</div>
</div>

<button class="btn btn-primary w-100 mb-3">
Register
</button>

<p class="text-center small">
Already have an account?
<a href="login-form.html">Login →</a>
</p>

</form>

</div>

</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
